<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Vibe - Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Billabong&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #fafafa; color: #262626; margin: 0; padding-bottom: 70px; }
        
        /* Header with Instagram Gradient Logo */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #dbdbdb; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Billabong', cursive; font-size: 36px; margin: 0; cursor: pointer; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .header-icons { display: flex; gap: 18px; align-items: center; }
        .header-icons svg { width: 24px; height: 24px; cursor: pointer; stroke: #000; fill: none; stroke-width: 2; }

        /* Auth Modal (Gmail OTP & Secure Login) */
        .auth-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .auth-box { background: #fff; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
        .auth-box h2 { font-family: 'Billabong', cursive; font-size: 40px; margin-bottom: 10px; }

        /* Feed & Posts */
        .feed-container { max-width: 470px; margin: 15px auto; }
        .post-card { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 20px; overflow: hidden; position: relative; }
        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
        .post-user { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; }
        .post-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #dc2743); overflow: hidden; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
        
        .header-right { display: flex; align-items: center; gap: 10px; }
        .follow-btn { background: #0095f6; color: #fff; border: none; padding: 4px 14px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }
        
        /* Media & Ads Overlay (5 Sec Skip Ad) */
        .media-box { position: relative; width: 100%; background: #000; min-height: 300px; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; max-height: 500px; object-fit: contain; display: block; background: #000; outline: none; }
        
        .ad-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; z-index: 10; text-align: center; padding: 20px; }
        .skip-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); border: 1px solid #fff; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; }

        /* Actions & Privacy Badge */
        .post-actions { display: flex; justify-content: space-between; padding: 10px 14px; align-items: center; }
        .actions-left { display: flex; gap: 16px; align-items: center; cursor: pointer; }
        .actions-left svg, .post-actions svg { width: 24px; height: 24px; stroke: #000; fill: none; stroke-width: 2; }
        .post-meta { padding: 0 14px 12px 14px; font-size: 13px; }
        .privacy-badge { font-size: 10px; background: #efefef; padding: 2px 6px; border-radius: 4px; color: #666; margin-left: 5px; }

        /* Studio & Admin Panel */
        .studio-box, .admin-box { max-width: 450px; margin: 20px auto; background: #fff; padding: 20px; border: 1px solid #dbdbdb; border-radius: 12px; }
        .admin-panel { background: #fff3e0; border: 1px solid #ffe0b2; padding: 15px; border-radius: 8px; margin: 15px auto; max-width: 450px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: #fff; border-top: 1px solid #dbdbdb; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .bottom-nav svg { width: 26px; height: 26px; stroke: #000; fill: none; stroke-width: 2; cursor: pointer; }

        .hidden { display: none; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 10px; border: 1px solid #dbdbdb; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; outline: none; font-size: 13px; }
    </style>
</head>
<body>

    <!-- SECURE GMAIL OTP LOGIN MODAL -->
    <div id="authModal" class="auth-modal">
        <div class="auth-box">
            <h2>Squid Vibe</h2>
            <p style="font-size:13px; color:#8e8e8e;">Secure Login with Gmail OTP</p>
            <input type="email" id="userEmail" placeholder="Enter your Gmail address">
            <button onclick="sendOTP()" style="width:100%; background:#0095f6; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:600; cursor:pointer;">Send OTP ✉️</button>
            <div id="otpSection" class="hidden" style="margin-top:15px;">
                <input type="text" id="otpInput" placeholder="Enter 6-digit OTP">
                <button onclick="verifyOTP()" style="width:100%; background:#00c853; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:600; cursor:pointer;">Verify & Login 🚀</button>
            </div>
        </div>
    </div>

    <header>
        <h1 class="logo" onclick="switchView('feed')">Squid Vibe</h1>
        <div class="header-icons">
            <svg onclick="switchView('upload')" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            <svg onclick="switchView('admin')" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>
    </header>

    <!-- FEED VIEW -->
    <div id="feedView" class="feed-container">
        <div id="postsContainer">Loading feed...</div>
    </div>

    <!-- UPLOAD & CREATOR STUDIO -->
    <div id="uploadView" class="feed-container hidden">
        <div class="studio-box">
            <h3 style="margin-top:0;">Creator Studio 🎨</h3>
            <input type="file" id="mediaFile" accept="video/mp4"><br>
            <input type="text" id="captionInput" placeholder="Write a caption...">
            
            <label style="font-size:12px; color:#666;">Privacy Setting:</label>
            <select id="privacySelect">
                <option value="public">🌐 Public (Everyone)</option>
                <option value="private">🔒 Private (Secret)</option>
            </select>

            <button onclick="publishMedia()" style="width:100%; background:#0095f6; color:#fff; border:none; padding:12px; border-radius:8px; font-weight:600; cursor:pointer; margin-top:10px;">Publish securely 🚀</button>
            <p id="uploadStatus" style="text-align:center; font-size:12px; color:#0095f6; margin-top:10px;"></p>
        </div>
    </div>

    <!-- ADMIN PANEL (Hidden for normal users) -->
    <div id="adminView" class="feed-container hidden">
        <div class="admin-box">
            <h3>🔒 Admin Control Panel</h3>
            <p style="font-size:12px; color:#666;">Only authorized administrator can access this panel.</p>
            <input type="password" id="adminPass" placeholder="Enter Admin Secret Password">
            <button onclick="verifyAdmin()" style="width:100%; background:#ff9800; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:600; cursor:pointer;">Access Admin</button>
            
            <div id="adminDashboard" class="hidden" style="margin-top:15px;">
                <hr>
                <p><b>Total Videos Hosted:</b> <span id="statVideos">0</span></p>
                <p><b>Ad Revenue Monetization:</b> Active ($124.50)</p>
                <button onclick="alert('Adult content filter rules updated!')" style="width:100%; background:#e53935; color:#fff; border:none; padding:8px; border-radius:6px; font-size:12px; cursor:pointer; margin-top:5px;">🛡️ Enforce Anti-NSFW / Adult Filter</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <svg onclick="switchView('feed')" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <svg onclick="switchView('upload')" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        <svg onclick="switchView('admin')" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </nav>

    <script>
        function sendOTP() {
            const email = document.getElementById('userEmail').value;
            if(!email || !email.includes('@')) { alert('Enter valid Gmail address!'); return; }
            alert('OTP sent to ' + email + ' (Simulated OTP: 123456)');
            document.getElementById('otpSection').classList.remove('hidden');
        }

        function verifyOTP() {
            const otp = document.getElementById('otpInput').value;
            if(otp === '123456') {
                document.getElementById('authModal').classList.add('hidden');
                alert('Login Successful! Welcome to Squid Vibe 🚀');
            } else {
                alert('Invalid OTP!');
            }
        }

        function switchView(view) {
            ['feedView', 'uploadView', 'adminView'].forEach(v => document.getElementById(v).classList.add('hidden'));
            if(view === 'feed') { document.getElementById('feedView').classList.remove('hidden'); loadFeed(); }
            if(view === 'upload') document.getElementById('uploadView').classList.remove('hidden');
            if(view === 'admin') document.getElementById('adminView').classList.remove('hidden');
        }

        function verifyAdmin() {
            const pass = document.getElementById('adminPass').value;
            if(pass === 'squidadmin2026') {
                document.getElementById('adminDashboard').classList.remove('hidden');
                alert('Admin verified successfully!');
            } else {
                alert('Incorrect Admin Password!');
            }
        }

        function initAd(adId, skipId) {
            setTimeout(() => {
                const ad = document.getElementById(adId);
                if(ad) ad.style.display = 'flex';
                
                let timeLeft = 5;
                const skipBtn = document.getElementById(skipId);
                const timer = setInterval(() => {
                    timeLeft--;
                    if(timeLeft > 0) {
                        skipBtn.innerText = `Skip in ${timeLeft}s`;
                    } else {
                        skipBtn.innerText = "Skip Ad ⏭";
                        skipBtn.disabled = false;
                        clearInterval(timer);
                    }
                }, 1000);
            }, 1000);
        }

        function skipAd(adId) {
            document.getElementById(adId).style.display = 'none';
        }

        async function publishMedia() {
            const fileInput = document.getElementById('mediaFile');
            const status = document.getElementById('uploadStatus');
            const privacy = document.getElementById('privacySelect').value;
            
            if(fileInput.files.length === 0) { alert('Select video!'); return; }
            
            const file = fileInput.files[0];
            status.innerText = "Processing secure upload...";

            try {
                const res = await fetch('/api/get-upload-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: file.name, privacy: privacy })
                });
                const data = await res.json();
                
                const s3Res = await fetch(data.uploadUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'video/mp4' },
                    body: file
                });

                if(s3Res.ok) {
                    status.innerText = "Published Successfully! 🎉";
                    setTimeout(() => switchView('feed'), 1000);
                }
            } catch(e) {
                status.innerText = "Upload failed.";
            }
        }

        async function loadFeed() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = "Loading...";
            try {
                const res = await fetch('/api/videos');
                const data = await res.json();
                container.innerHTML = "";
                document.getElementById('statVideos').innerText = data.videos.length;

                if(data.videos && data.videos.length > 0) {
                    data.videos.forEach((v, idx) => {
                        const adId = `ad_${idx}`;
                        const skipId = `skip_${idx}`;

                        container.innerHTML += `
                            <div class="post-card">
                                <div class="post-header">
                                    <div class="post-user">
                                        <div class="post-avatar">SV</div>
                                        <span>squid_creator <span class="privacy-badge">${v.privacy || 'Public'}</span></span>
                                    </div>
                                </div>
                                <div class="media-box">
                                    <!-- 5-Sec Skip Ad Overlay -->
                                    <div id="${adId}" class="ad-overlay">
                                        <button id="${skipId}" class="skip-btn" disabled onclick="skipAd('${adId}')">Skip in 5s</button>
                                        <h3 style="color:#ff9800;">📢 Sponsored Ad</h3>
                                        <p style="font-size:12px;">Monetization Active (Ad Revenue Connected)</p>
                                    </div>
                                    <!-- ControlsList="nodownload" strictly prevents downloading -->
                                    <video controls controlsList="nodownload" preload="metadata" playsinline onplay="initAd('${adId}', '${skipId}')">
                                        <source src="${v.url}" type="video/mp4">
                                        Your browser does not support video.
                                    </video>
                                </div>
                                <div class="post-meta"><b>squid_creator</b> Secured Media Stream 🛡️</div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = "<p style='text-align:center; color:#8e8e8e;'>No videos available.</p>";
                }
            } catch(e) {
                container.innerHTML = "<p style='text-align:center; color:red;'>Failed to load feed.</p>";
            }
        }

        loadFeed();
    </script>
</body>
</html>
